name: build-windows  
  
on:  
  push:  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Install win_flex_bison  
        run: choco install winflexbison3 -y  
  
      - name: Configure CMake (Win32)  
        run: cmake -S . -B build -A Win32 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DFLEX_EXECUTABLE=C:/ProgramData/chocolatey/bin/win_flex.exe" "-DBISON_EXECUTABLE=C:/ProgramData/chocolatey/bin/win_bison.exe"  
  
      - name: Build Release  
        run: cmake --build build --config Release --parallel  
  
      - name: Upload artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: zelda-classic-win32  
          path: |  
            build/Release/zelda.exe  
            build/Release/zquest.exe  
            build/Release/romview.exe  
            build/Release/zcsound.dll
